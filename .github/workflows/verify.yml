name: Verify application
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:55439/student_vault_test
      DATABASE_TEST_URL: postgresql://postgres@127.0.0.1:55439/student_vault_test
      RUN_DATABASE_INTEGRATION_TESTS: "1"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start isolated loopback PostgreSQL
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql
          PG_BIN="$(pg_config --bindir)"
          PG_DATA="$RUNNER_TEMP/student-vault-postgres"
          echo "TEST_PG_BIN=$PG_BIN" >> "$GITHUB_ENV"
          test ! -e "$PG_DATA"
          "$PG_BIN/initdb" -D "$PG_DATA" -U postgres --auth=trust --encoding=UTF8 --locale=C
          "$PG_BIN/pg_ctl" -D "$PG_DATA" -l "$RUNNER_TEMP/student-vault-postgres.log" -o "-h 127.0.0.1 -p 55439" -w start
          "$PG_BIN/createdb" -h 127.0.0.1 -p 55439 -U postgres student_vault_test
          "$PG_BIN/psql" -h 127.0.0.1 -p 55439 -U postgres -d student_vault_test -c 'SELECT version(), current_database(), inet_server_addr();'
      - run: python -m pip install -r backend/requirements-documents.txt
      - run: npm ci
        working-directory: backend
      - run: npm run prisma:generate && npm run prisma:migrate:deploy
        working-directory: backend
      - run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
        working-directory: backend
      - run: npm test && npm run typecheck && npm run lint && npm run build
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm test -- --pool=threads --maxWorkers=1 --no-file-parallelism && npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          NODE_ENV: production
      - run: git diff --check
      - name: Stop isolated PostgreSQL
        if: always()
        shell: bash
        run: |
          if [ -n "$TEST_PG_BIN" ] && [ -f "$RUNNER_TEMP/student-vault-postgres/postmaster.pid" ]; then
            "$TEST_PG_BIN/pg_ctl" -D "$RUNNER_TEMP/student-vault-postgres" -m fast -w stop
          fi
