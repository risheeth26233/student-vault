name: Verify application
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: student_vault_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d student_vault_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:integration-only@127.0.0.1:5432/student_vault_test
      DATABASE_TEST_URL: postgresql://postgres:integration-only@127.0.0.1:5432/student_vault_test
      RUN_DATABASE_INTEGRATION_TESTS: "1"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements-documents.txt
      - run: npm ci
        working-directory: backend
      - run: npm run prisma:generate && npm run prisma:migrate:deploy
        working-directory: backend
      - run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
        working-directory: backend
      - run: npm test && npm run typecheck && npm run lint && npm run build
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm test -- --pool=threads --maxWorkers=1 --no-file-parallelism && npm run lint && npm run build
        working-directory: frontend
      - run: git diff --check
